name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release
      publish:
        needs: build
        runs-on: ubuntu-latest

        steps:
          - uses: actions/download-artifact@v4
            with:
              path: artifacts

          - name: Create GitHub release
            env:
              GH_TOKEN: ${{ github.token }}
            run: |
              gh release create "${{ inputs.version }}" \
                --generate-notes \
                artifacts/**/*

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: http-stub-${{ runner.os }}
          path: |
            target/release/http-stub
            target/release/http-stub.exe
          if-no-files-found: ignore
